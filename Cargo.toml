[package]
name = "clibrary"
version = "0.1.1"
edition = "2024"
rust-version = "1.88"
description = "A navigable, metadata-aware personal library for EPUB files"
license = "MIT"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4", features = ["derive", "env"] }
crossterm = "0.28"
dirs = "7"
fs2 = "0.4"
hex = "0.4"
percent-encoding = "2"
ratatui = "0.29"
roxmltree = "0.21"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
unicode-width = "0.2"
walkdir = "2"
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = true
strip = true
